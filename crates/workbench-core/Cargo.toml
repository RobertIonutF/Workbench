[package]
name = "workbench-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "workbench_core"

[[bin]]
name = "workbench-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
pbkdf2 = "0.12"
pdf-extract = "0.12"
portable-pty = "0.9"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
ignore = "0.4"
jsonschema = { version = "0.33", default-features = false }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
keyring = { version = "3.6", features = ["windows-native"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
similar = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = "0.28"
tower-http = { version = "0.6", features = ["fs", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
webbrowser = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
